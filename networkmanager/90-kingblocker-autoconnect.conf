# Installed to /etc/NetworkManager/conf.d/ by tools/add_wifi_networks.sh
# (install.sh step 12).
#
# Keep trying saved Wi-Fi networks forever. NetworkManager's default is 4
# attempts, after which it stops auto-connecting a profile for ~5 minutes:
# a unit that booted while its hotspot was off failed those attempts and then
# ignored the hotspot for minutes after it came back (kingblocker9000,
# 2026-11-18). The unit has no setup hotspot of its own, so rejoining a saved
# network is the only way back onto the network.
[connection]
connection.autoconnect-retries=0
