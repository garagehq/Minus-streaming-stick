# Installed to /etc/systemd/journald.conf.d/ by install.sh (step 11).
#
# Explicit bounds for the system journal. Without them journald allows 10%
# of the root filesystem (~2.9 GB on a 32 GB card) and the runtime journal in
# /run (RAM) is only bounded by its own default. Minus logs everything to the
# journal (and ustreamer failures with their output), and the journal is what
# survives a power cycle for debugging, so keep it persistent but capped:
# journald deletes the oldest archived files first.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemMaxFileSize=20M
SystemKeepFree=1G
RuntimeMaxUse=32M
RuntimeMaxFileSize=8M
MaxRetentionSec=1month
